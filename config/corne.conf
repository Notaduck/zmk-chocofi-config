# Display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# nice-view-gem: no animation, fixed frame on the peripheral
CONFIG_NICE_VIEW_GEM_ANIMATION=n
CONFIG_NICE_VIEW_GEM_ANIMATION_FRAME=1

# Sleep 30m * 60s * 1000ms = 1800000
CONFIG_ZMK_SLEEP=y # Enable deep sleep support
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Bluetooth
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_KEYBOARD_NAME="Chocofi"

# Debugging the vendored nice_oled shield on Zephyr 4.1
CONFIG_ZMK_USB_LOGGING=y
